<div [attr.inert]="state.isFeedbackOpen() ? '' : null">
  @if (navigationRecovery.loadFailed()) {
    <section class="navigation-recovery" aria-label="Page loading problem">
      <div role="alert">
        <p>This page could not be loaded. Save any changes, then reload and try again.</p>
        @if (state.hasUnsavedCourseChanges()) {
          <p>Save your course changes before reloading. Your edits are still here.</p>
        }
      </div>
      <button appButton="secondary" [disabled]="state.hasUnsavedCourseChanges()"
        (click)="navigationRecovery.reload(state.hasUnsavedCourseChanges())">Reload page</button>
    </section>
  }
  <router-outlet />
</div>
<app-confirm-dialog />
@if (state.isFeedbackOpen()) {
  <app-feedback-dialog
    [submitted]="state.feedbackSubmitted()"
    [page]="state.feedbackPage()"
    [draft]="state.feedbackComposer.draft()"
    [submitting]="state.feedbackSubmitting()"
    [error]="state.feedbackError()"
    [returnFocusTo]="state.feedbackComposer.focusTarget()"
    (changed)="state.feedbackComposer.change($event)"
    (closed)="state.closeFeedback()"
    (submittedClicked)="state.submitFeedback()"
  />
}
