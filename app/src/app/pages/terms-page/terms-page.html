<main
  class="min-h-[100dvh] bg-[var(--shell-bg)] px-4 py-4 text-[var(--ink)] sm:px-6 lg:px-8 lg:py-6"
>
  <section
    class="mx-auto flex min-h-[calc(100dvh-32px)] w-full max-w-4xl flex-col rounded-[28px] border border-[var(--panel-border)] bg-[var(--panel-base)] shadow-[0_30px_80px_rgba(23,27,74,0.12)] lg:min-h-0"
  >
    <div
      class="border-b border-[var(--panel-border)] bg-[linear-gradient(180deg,#fffdfa_0%,#f8f3eb_100%)] px-6 py-6 sm:px-10 lg:px-12"
    >
      <div class="flex flex-col gap-6">
        <app-brand-link />
        <div class="max-w-[720px]">
          <p class="text-[12px] font-semibold uppercase tracking-[0.24em] text-[var(--accent-deep)]">
            Legal
          </p>
          <h1 class="mt-2 !mb-0 text-[32px] font-extrabold leading-[1.05] text-[var(--form-ink)]">
            {{ document.title }}
          </h1>
          <p class="mt-3 max-w-[640px] text-[15px] leading-6 text-[var(--muted)]">
            {{ document.intro }}
          </p>
          <p class="mt-2 text-[13px] text-[var(--muted)]">
            Version {{ document.version }}, effective {{ document.effectiveDate }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex-1 px-6 py-8 sm:px-10 lg:px-12">
      <div class="max-w-[720px] space-y-8">
        @for (section of document.sections; track section.heading; let index = $index) {
          <section class="space-y-2">
            <h2 class="!mb-0 text-[20px] font-bold text-[var(--form-ink)]">{{ index + 1 }}. {{ section.heading }}</h2>
            <p class="text-[15px] leading-7 text-[var(--muted)]">{{ section.body }}</p>
          </section>
        }

        <div class="border-t border-[var(--panel-border)] pt-6">
          <a
            class="text-[14px] font-semibold text-[var(--form-ink)] underline decoration-[rgba(47,79,67,0.35)] underline-offset-2 transition hover:text-[var(--accent-deep)]"
            routerLink="/"
          >
            Back to QI Academy
          </a>
        </div>
      </div>
    </div>
  </section>
</main>
