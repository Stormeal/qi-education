<nav class="topbar" aria-label="Primary navigation">
  <button #menuTrigger class="header-icon mobile-menu-trigger" type="button" aria-label="Open navigation"
    [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-navigation" (click)="mobileMenuOpen.set(!mobileMenuOpen())">
    <app-icon name="menu" aria-hidden="true" />
  </button>
  <app-brand-link [compact]="true" />
  <div class="tabs" aria-label="Site sections">
    <a class="tab-link" [routerLink]="homeHref" [class.active]="activeSection() === 'home'">Home</a>
    <a class="tab-link" routerLink="/about" [class.active]="activeSection() === 'about'">About</a>
    <a class="tab-link" [routerLink]="coursesHref" [class.active]="activeSection() === 'courses'">Catalog</a>
    <a class="tab-link" [routerLink]="libraryHref" [class.active]="activeSection() === 'library'">My Learning</a>
    @if (canSeeRoadmap()) { <a class="tab-link" routerLink="/roadmap" [class.active]="activeSection() === 'roadmap'">Roadmap</a> }
  </div>
  <div class="header-controls">
    <app-notification-bell [unreadCount]="unreadCount()" (opened)="closeMobileMenu(false); notificationsOpened.emit()" />
    <button class="feedback-control" appButton type="button" (click)="feedbackOpened.emit()">
      <app-icon name="message" aria-hidden="true" /> Feedback <app-icon name="chevronDown" aria-hidden="true" />
    </button>
    <a class="header-icon settings-control" routerLink="/settings" aria-label="Settings"><app-icon name="settings" aria-hidden="true" /></a>
    <app-profile-menu [displayName]="displayName()" [email]="email()" [roleLabel]="roleLabel()" [canAccessAdmin]="canAccessAdmin()"
      (loggedOut)="loggedOut.emit()" (adminSelected)="adminClicked.emit()" (careerPathSelected)="careerPathClicked.emit()" />
  </div>
  @if (mobileMenuOpen()) {
    <div id="mobile-navigation" class="mobile-navigation">
      <a routerLink="/" (click)="closeMobileMenu(false)">Home</a>
      <a routerLink="/about" (click)="closeMobileMenu(false)">About</a>
      <a routerLink="/courses" (click)="closeMobileMenu(false)">Catalog</a>
      <a routerLink="/library" (click)="closeMobileMenu(false)">My Learning</a>
      @if (canSeeRoadmap()) { <a routerLink="/roadmap" (click)="closeMobileMenu(false)">Roadmap</a> }
      <button type="button" (click)="feedbackOpened.emit(); closeMobileMenu(false)"><app-icon name="message" aria-hidden="true" /> Feedback</button>
      <a routerLink="/settings" (click)="closeMobileMenu(false)"><app-icon name="settings" aria-hidden="true" /> Settings</a>
    </div>
  }
</nav>
