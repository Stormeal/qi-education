<button #trigger class="notification-trigger" type="button" aria-label="Notifications" [attr.aria-expanded]="isOpen()"
  [attr.aria-describedby]="count() > 0 ? 'notification-unread-count' : null"
  aria-controls="notification-panel" (click)="toggle()">
  <app-icon name="bell" />
  @if (count() > 0) { <span class="notification-dot" aria-hidden="true"></span><span id="notification-unread-count" class="sr-only">{{ count() }} unread</span> }
</button>
@if (isOpen()) {
  <section id="notification-panel" class="notification-panel" role="region" aria-label="Notifications">
    <header><h2>Notifications</h2><button appButton="ghost" size="sm" [disabled]="busy() || count() === 0" (click)="markAll()">Mark all read</button></header>
    @if (error()) { <p class="notification-error" role="alert">{{ error() }}</p><button appButton="ghost" size="sm" (click)="load()">Retry</button> }
    @if (loading()) { <p class="notification-state" role="status">Loading notifications...</p> }
    @else if (!error() && items().length === 0) { <p class="notification-state">You're all caught up.</p> }
    @else {
      <ul>
        @for (row of items(); track row.id) {
          <li><button class="notification-item" [class.unread]="row.readAt === null" [disabled]="busy()" (click)="select(row)">
            <app-icon [name]="icon(row)" /><span><strong>{{ row.title }}</strong><time [attr.datetime]="row.createdAt" [attr.title]="row.createdAt">{{ relativeTime(row.createdAt) }}</time></span>
          </button></li>
        }
      </ul>
    }
  </section>
}
