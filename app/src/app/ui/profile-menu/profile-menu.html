<div class="profile-menu">
  <button
    type="button"
    class="profile-trigger"
    aria-haspopup="menu"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-label]="identity.organizationName() ? 'Open profile menu, ' + identity.organizationName() : 'Open profile menu'"
    (click)="toggleMenu()"
  >
    @if (identity.organizationName()) {
      <span class="profile-org" aria-hidden="true">{{ identity.organizationName() }}</span>
    }
    <span class="profile-avatar" aria-hidden="true" [style.background]="identity.avatarColor()">{{ initials() || 'U' }}</span>
  </button>

  @if (isOpen()) {
    <div class="profile-dropdown" role="menu" aria-label="Profile menu">
      <div class="profile-summary">
        <span class="profile-summary-avatar" aria-hidden="true" [style.background]="identity.avatarColor()">{{ initials() || 'U' }}</span>
        <div>
          <strong>{{ displayName() }}</strong>
          <span>{{ email() }}</span>
          <small>{{ roleLabel() }}@if (identity.organizationName()) {, {{ identity.organizationName() }}}</small>
        </div>
      </div>

      <button type="button" role="menuitem" class="profile-menu-item" (click)="selectProfile()">
        <app-icon name="user" />
        Profile
      </button>
      <button type="button" role="menuitem" class="profile-menu-item" (click)="selectSettings()">
        <app-icon name="settings" />
        Settings
      </button>
      <button type="button" role="menuitem" class="profile-menu-item" (click)="selectCareerPath()">
        <app-icon name="compass" />
        Career Path
      </button>
      <button type="button" role="menuitem" class="profile-menu-item" (click)="selectOrganization()">
        <app-icon name="users" />
        Organization
      </button>
      @if (canAccessAdmin()) {
        <button type="button" role="menuitem" class="profile-menu-item" (click)="selectAdmin()">
          <app-icon name="shield" />
          Admin
        </button>
      }
      <button type="button" role="menuitem" class="profile-menu-item danger" (click)="logout()">
        <app-icon name="logout" />
        Logout
      </button>
    </div>
  }
</div>
