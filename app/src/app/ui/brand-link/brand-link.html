<a
  class="brand-link"
  [class.brand-link-compact]="compact()"
  [class.brand-link-light]="appearance() === 'light'"
  [class.brand-link-large]="size() === 'large'"
  [routerLink]="href()"
  [attr.aria-label]="ariaLabel()"
>
  <img class="brand-logo" src="qi-academy-logo.webp" alt="" width="2000" height="586" decoding="async" />
</a>
